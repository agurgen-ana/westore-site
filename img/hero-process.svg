<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <style>
      .stroke { fill: none; stroke: #111; stroke-width: 4; }
      .stroke-thin { fill: none; stroke: #111; stroke-width: 2; }
      .accent { fill: #ff0000; }
      .accent-stroke { fill: none; stroke: #ff0000; stroke-width: 4; }
    </style>
  </defs>

  <!-- base line -->
  <line x1="60" y1="420" x2="1140" y2="420" class="stroke"/>

  <!-- INBOUND / RECEIVING -->
  <g transform="translate(80,180)">
    <!-- pallets -->
    <rect x="0" y="80" width="120" height="60" class="accent"/>
    <rect x="140" y="80" width="120" height="60" class="accent"/>
    <rect x="70" y="0" width="120" height="60" class="accent"/>

    <!-- frame -->
    <rect x="-20" y="-20" width="300" height="180" class="stroke"/>
  </g>

  <!-- arrow to warehouse -->
  <path d="M420 260 C470 200, 530 200, 580 260" class="accent-stroke"/>
  <polygon points="580,260 560,252 560,268" fill="#ff0000"/>

  <!-- WAREHOUSE -->
  <g transform="translate(520,120)">
    <!-- building -->
    <polygon points="0,120 160,0 320,120" class="stroke"/>
    <rect x="20" y="120" width="280" height="220" class="stroke"/>

    <!-- racks -->
    <rect x="40" y="160" width="80" height="140" class="stroke-thin"/>
    <rect x="140" y="160" width="80" height="140" class="stroke-thin"/>
    <rect x="240" y="160" width="40" height="140" class="stroke-thin"/>

    <!-- pallets on racks -->
    <rect x="48" y="172" width="64" height="24" class="accent"/>
    <rect x="48" y="210" width="64" height="24" class="accent"/>
    <rect x="148" y="172" width="64" height="24" class="accent"/>
    <rect x="148" y="210" width="64" height="24" class="accent"/>
    <rect x="248" y="172" width="24" height="24" class="accent"/>
    <rect x="248" y="210" width="24" height="24" class="accent"/>
  </g>

  <!-- arrow to outbound -->
  <path d="M760 260 C810 200, 870 200, 920 260" class="accent-stroke"/>
  <polygon points="920,260 900,252 900,268" fill="#ff0000"/>

  <!-- OUTBOUND / TRUCK -->
  <g transform="translate(900,250)">
    <!-- truck body -->
    <rect x="0" y="40" width="180" height="80" class="stroke"/>
    <rect x="140" y="10" width="80" height="110" class="stroke"/>

    <!-- wheels -->
    <circle cx="40" cy="130" r="16" class="stroke"/>
    <circle cx="140" cy="130" r="16" class="stroke"/>

    <!-- cargo -->
    <rect x="20" y="56" width="40" height="24" class="accent"/>
    <rect x="70" y="56" width="40" height="24" class="accent"/>
    <rect x="120" y="56" width="40" height="24" class="accent"/>
  </g>
</svg>
